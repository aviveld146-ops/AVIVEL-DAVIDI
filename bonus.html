<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="סימן לידה — חוברת הקומיקס של אביב-אל דוידי">
  <title>סימן לידה — אביב-אל דוידי</title>
  <base href="https://aviveld146-ops.github.io/AVIVEL-DAVIDI/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style id="site-style"></style>
  <style>
    .gallery-topbar{position:relative;z-index:5;min-height:72px;padding:0 7vw;display:flex;align-items:center;justify-content:space-between;gap:22px;background:#170627;color:#fffaff;border-bottom:1px solid rgba(255,250,255,.22);font-family:"Heebo",Arial,sans-serif}.gallery-brand{font-size:17px;font-weight:900;line-height:.8;letter-spacing:-.08em}.gallery-topbar nav{display:flex;gap:18px;font-size:14px;font-weight:700}.gallery-topbar a{color:inherit;text-decoration:none}.gallery-topbar a:hover{color:#ff5b62}.gallery-topbar .back{border-bottom:1px solid #ff5b62;padding-bottom:4px}@media(max-width:650px){.gallery-topbar{padding:0 6vw;min-height:64px}.gallery-topbar nav{gap:12px;font-size:13px}}
  </style>
</head>
<body>
  <header class="gallery-topbar"><a class="gallery-brand" href="index.html">AV<br>DAVIDI</a><nav><a class="back" href="index.html">חזרה לדף הראשי</a><a href="works.html">עבודות בלימודים</a></nav></header>
  <main id="gallery-host" aria-live="polite"><p style="padding:48px 7vw;margin:0;color:#fffaff;background:#170627;font-family:Heebo,Arial,sans-serif">טוען את סימן לידה…</p></main>
  <script>
    (async()=>{
      const html=await fetch('index.html',{cache:'no-store'}).then(response=>{if(!response.ok)throw new Error('load failed');return response.text()});
      const source=new DOMParser().parseFromString(html,'text/html');
      document.querySelector('#site-style').textContent=source.querySelector('style').textContent;
      document.querySelector('#gallery-host').replaceWith(source.querySelector('#work'));
      document.body.append(source.querySelector('#modal'));
      const app=document.createElement('script');app.textContent=source.scripts[source.scripts.length-1].textContent;document.body.append(app);
      const bonus=document.createElement('script');bonus.textContent=`
        selectGallery('bonus');
        const bonusProjects=[
          comicProject,
          {title:'פינק סנטיפד',subtitle:'Concept artwork',items:[{type:'image',src:'media/bonus/pink-centipede-cover.png'}]},
          {title:'הכאב שבשקט',subtitle:'מחזה לקריאה מלאה',items:[{type:'text',src:'media/writing/the-pain-in-silence.txt'}]},
          {title:'אהבת אחים',subtitle:'מחזה לקריאה מלאה',items:[{type:'text',src:'media/writing/brotherly-love.txt'}]}
        ];
        workTitle.textContent='בונוס';
        workKicker.textContent='02 / BONUS';
        galleryNote.textContent='קומיקס, עטיפות וכתיבה מקורית — לחצו על כרטיס כדי להיכנס.';
        renderGrid(bonusProjects);
      `;document.body.append(bonus);
    })().catch(()=>{document.querySelector('#gallery-host').innerHTML='<p style="padding:48px 7vw;color:#fffaff;background:#170627">לא הצלחנו לטעון את הקומיקס. נסו לרענן את הדף.</p>'});
  </script>
</body>
</html>
